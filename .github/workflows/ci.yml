name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The gdext crate links the `godot` crate, which builds without an engine.
  RUSTFLAGS: ""

jobs:
  # Formatting, lints, and the kernel-free half of the suite. Every physics test
  # that needs the JPL kernels skips green here — deliberately (see
  # core/src/kernels.rs) — and the `physics` job below is where they run.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: system libraries for the egui viewer
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --release
      - name: tests (kernel-free)
        run: cargo test --workspace --release

  # The physics suite with the real DE440 field. Kernels are fetched once and
  # cached; ASTEROID_REQUIRE_KERNELS turns a silent skip into a failure, so a
  # green run here means the physics actually ran.
  physics:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cache kernels
        id: kernels
        uses: actions/cache@v4
        with:
          path: kernels
          key: kernels-${{ hashFiles('tools/fetch_kernels.py', 'pyref/fetch_horizons_neo.py') }}
      - name: fetch kernels (DE440 + pck11 + Horizons NEO tables)
        if: steps.kernels.outputs.cache-hit != 'true'
        run: python tools/fetch_kernels.py --neo
      - name: core physics (kernels required)
        run: ASTEROID_REQUIRE_KERNELS=1 cargo test -p asteroid_core -p validation --release
